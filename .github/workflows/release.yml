name: Release

# Запуск: на вкладке Actions -> Release -> Run workflow, или пушем тега вида v0.1.0
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest   # Apple Silicon
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Frontend
        uses: actions/checkout@v4
        with:
          path: frontend

      # Бэкенд лежит в соседнем репозитории; если он приватный, нужен секрет BACKEND_REPO_TOKEN
      - name: Backend
        uses: actions/checkout@v4
        with:
          repository: Itarimit-prog/ItarimSystemBackend
          path: backend
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Build backend sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: backend
        run: ./build_sidecar.ps1

      - name: Build backend sidecar (macOS)
        if: runner.os == 'macOS'
        working-directory: backend
        run: bash build_sidecar.sh

      # Тот же локальный ключ, что зашит в src-tauri/src/main.rs (бэкенд слушает только 127.0.0.1)
      - name: API key for frontend build
        shell: bash
        run: echo "VITE_API_KEY=wTuwr_26oJsfMIB1BReNxSoYlO91E3OsfIBNsfaW3qI" > frontend/.env

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          releaseName: 'Itarim System ${{ startsWith(github.ref, ''refs/tags/'') && github.ref_name || format(''build-{0}'', github.run_number) }}'
          releaseBody: 'Установщики: Windows — файл *-setup.exe, macOS (Apple Silicon) — файл .dmg.'
          releaseDraft: true
          args: --bundles ${{ matrix.bundles }}
